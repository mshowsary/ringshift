<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ringshift</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234de3ff' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%234de3ff'/%3E%3C/svg%3E">
  <script src="https://www.youtube.com/game_api/v1"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/sdk.js" defer></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/render.js" defer></script>
  <script src="js/audio.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/main.js" defer></script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="splash" class="screen">
    <h1 class="title neon">RINGSHIFT</h1>
    <p class="loading-pulse" data-i18n="loading">Loading…</p>
  </div>

  <div id="screen-menu" class="screen hidden">
    <h1 class="title neon">RINGSHIFT</h1>
    <p class="tagline" data-i18n="tagline">Hop rings. Dodge. Survive.</p>
    <p id="menu-best" class="menu-best hidden"></p>
    <button id="btn-play" class="btn btn-primary" data-i18n="play">Play</button>
    <button id="btn-settings" class="btn btn-secondary" data-i18n="settings">Settings</button>
  </div>

  <div id="hud" class="hidden">
    <div id="hud-score" class="hud-score">0</div>
    <div id="hud-combo" class="hud-combo hidden">x1</div>
    <button id="btn-pause" class="btn btn-icon" aria-label="Pause">II</button>
  </div>

  <div id="howto-hint" class="hint hidden" data-i18n="howtoHint">Tap to switch rings</div>

  <div id="overlay-pause" class="overlay hidden">
    <div class="panel">
      <h2 data-i18n="paused">Paused</h2>
      <button id="btn-resume" class="btn btn-primary" data-i18n="resume">Resume</button>
      <button id="btn-pause-menu" class="btn btn-secondary" data-i18n="menu">Menu</button>
    </div>
  </div>

  <div id="overlay-settings" class="overlay hidden">
    <div class="panel">
      <h2 data-i18n="settings">Settings</h2>
      <div class="setting-row">
        <label for="slider-music" data-i18n="music">Music</label>
        <input type="range" id="slider-music" min="0" max="100" value="80">
      </div>
      <div class="setting-row">
        <label for="slider-sfx" data-i18n="sfx">Sound effects</label>
        <input type="range" id="slider-sfx" min="0" max="100" value="100">
      </div>
      <button id="btn-close-settings" class="btn btn-primary" data-i18n="close">Close</button>
    </div>
  </div>

  <div id="screen-gameover" class="screen hidden">
    <div class="panel">
      <h2 data-i18n="gameOver">Game over</h2>
      <p id="over-newbest" class="newbest hidden" data-i18n="newBest">New best!</p>
      <div class="score-row"><span data-i18n="score">Score</span><span id="over-score">0</span></div>
      <div class="score-row"><span data-i18n="best">Best</span><span id="over-best">0</span></div>
      <button id="btn-again" class="btn btn-primary" data-i18n="playAgain">Play again</button>
      <button id="btn-over-menu" class="btn btn-secondary" data-i18n="menu">Menu</button>
    </div>
  </div>
</body>
</html>
